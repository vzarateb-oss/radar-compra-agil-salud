
name: Radar - piloto ingesta sanitaria

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  piloto:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install "requests>=2.31,<3"

      - name: Ejecutar piloto de ingesta
        env:
          MERCADOPUBLICO_TICKET: ${{ secrets.MERCADOPUBLICO_TICKET }}
        run: python scripts/actualizar_radar_v1.py

      - name: Guardar resultados del piloto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-piloto-resultados
          path: |
            clasificacion_piloto.csv
            reporte_piloto.json
          if-no-files-found: warn
          retention-days: 14
