name: Radar - piloto V3.1.1 auditoria

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  piloto-v311:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: python -m pip install "requests>=2.31,<3"
      - name: Probar clasificador V3.1.1
        run: python scripts/probar_clasificador_v311.py
      - name: Ejecutar ingesta V3.1.1
        env:
          MERCADOPUBLICO_TICKET: ${{ secrets.MERCADOPUBLICO_TICKET }}
        run: python scripts/actualizar_radar_v311.py
      - name: Guardar auditoria V3.1.1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-v311-resultados
          path: staging_radar_v311/
          if-no-files-found: warn
          retention-days: 14
