name: Radar V4 - pruebas sin API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar rama de desarrollo V4
        uses: actions/checkout@v4
        with:
          ref: desarrollo/radar-v4
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencia de pruebas
        run: python -m pip install 'requests>=2.31,<3'
      - name: Comprobar sintaxis V4
        run: python -m compileall -q scripts/actualizar_radar_v4.py scripts/probar_clasificador_v4.py scripts/reclasificar_radar_v4.py scripts/probar_integracion_v4.py
      - name: Probar clasificador y reintentos sin API
        run: python scripts/probar_clasificador_v4.py
      - name: Probar ingesta simulada sin API
        run: python scripts/probar_integracion_v4.py
