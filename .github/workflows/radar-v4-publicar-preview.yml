name: Radar V4 - preparar vista Streamlit (solo desarrollo)

on:
  push:
    branches:
      - desarrollo/radar-v4
    paths:
      - 'app_v4_preview.py'
      - 'scripts/preparar_dashboard_v4.py'
      - '.github/workflows/radar-v4-publicar-preview.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: radar-v4-preview-development
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar rama de desarrollo
        uses: actions/checkout@v4
        with:
          ref: desarrollo/radar-v4
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar requests
        run: python -m pip install 'requests>=2.31,<3'
      - name: Obtener captura real del piloto (sin consultar API)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/radar-v4-captura
          gh api repos/${{ github.repository }}/actions/artifacts/14754237515/zip > /tmp/radar-v4-captura.zip
          unzip -q /tmp/radar-v4-captura.zip -d /tmp/radar-v4-captura
          test -s /tmp/radar-v4-captura/detalles_crudos_v4.jsonl
          test -s /tmp/radar-v4-captura/auditoria_v4.csv
      - name: Validar clasificador con registros reales
        run: python scripts/auditar_cache_v4.py /tmp/radar-v4-captura/detalles_crudos_v4.jsonl /tmp/radar-v4-captura/auditoria_v4.csv /tmp/radar-v4-auditoria
      - name: Generar datos para vista Streamlit
        run: python scripts/preparar_dashboard_v4.py /tmp/radar-v4-captura/detalles_crudos_v4.jsonl staging_dashboard_v4
      - name: Verificar que la salida no incluye datos crudos ni oportunidades no sanitarias
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('staging_dashboard_v4')
          report=json.loads((root/'resumen_dashboard_v4.json').read_text())
          assert report['registros_evaluados']==105,report
          assert report['sanitarias_A']==10,report
          assert report['revision_C']==1,report
          assert report['excluidas']==94,report
          assert report['pendientes']==0,report
          assert report['asincronicas_confirmadas']>=1,report
          assert not list(root.glob('*.jsonl'))
          with (root/'oportunidades_sanitarias_v4.csv').open(encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          assert all(r['Pertinencia sanitaria']=='A' for r in rows)
          assert all(r['Codigo']!='2378-294-COT26' for r in rows)
          print('Validacion de staging OK:',report)
          PY
      - name: Guardar CSV de vista previa SOLO en rama de desarrollo
        run: |
          test "$(git branch --show-current)" = "desarrollo/radar-v4"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging_dashboard_v4/
          if git diff --cached --quiet; then
            echo "No hay cambios en los datos de staging."
          else
            git commit -m "data(v4): snapshot validado para vista previa Streamlit"
            git push origin HEAD:desarrollo/radar-v4
          fi
